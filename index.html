<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="漢字 N5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<title>漢字 N5</title>
<style>
:root{
  --papier:#EDEFEA; --carte:#F7F8F5; --encre:#1C2B33; --doux:#566A73;
  --regle:#BCC9C6; --indigo:#2E5A6B; --shu:#C0453B; --or:#A88A3F; --vert:#3F7A5E;
}
@media (prefers-color-scheme: dark){
  :root{
    --papier:#141A1E; --carte:#1B2429; --encre:#DDE4E2; --doux:#8CA0A6;
    --regle:#35444A; --indigo:#79A9B5; --shu:#D6685E; --or:#C0A45C; --vert:#68A588;
  }
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--papier); color:var(--encre);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","MS Mincho",serif}
#app{
  max-width:640px; margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(80px + env(safe-area-inset-bottom));
  min-height:100%;
}

/* ---- structure ---- */
header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
h1{font-size:24px;letter-spacing:.14em;font-weight:400;margin:0}
h2{font-size:15px;font-weight:500;margin:26px 0 10px;letter-spacing:.02em}
.meta{font-size:12px;color:var(--doux);font-variant-numeric:tabular-nums}
.note{border-left:2px solid var(--or);padding:10px 0 10px 12px;margin:16px 0;font-size:13px;color:var(--doux)}
.vide{text-align:center;padding:48px 16px;color:var(--doux);font-size:14px}
.rangee{display:flex;gap:8px;align-items:center}
.centre{text-align:center}

/* ---- boutons ---- */
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:2px}
.b1{width:100%;border:none;padding:15px;background:var(--indigo);color:var(--papier);display:block}
.b1:disabled{background:var(--regle);color:var(--doux)}
.b2{background:none;border:1px solid var(--regle);color:var(--doux);padding:9px 14px;font-size:13px}
.b2:hover,.b2.on{border-color:var(--indigo);color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}

/* ---- carreau d'écriture ---- */
.carreau{
  position:relative;width:100%;max-width:240px;margin:0 auto;aspect-ratio:1/1;
  border:1px solid var(--regle);background:var(--carte);
  display:flex;align-items:center;justify-content:center;touch-action:none;
}
.carreau::before,.carreau::after{content:"";position:absolute;opacity:.75;pointer-events:none}
.carreau::before{left:6%;right:6%;top:50%;height:1px;background:repeating-linear-gradient(90deg,var(--regle) 0 4px,transparent 4px 9px)}
.carreau::after{top:6%;bottom:6%;left:50%;width:1px;background:repeating-linear-gradient(180deg,var(--regle) 0 4px,transparent 4px 9px)}
.glyphe{font-size:120px;line-height:1;position:relative;z-index:1}
.carreau svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
.carreau svg path,.carreau svg polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fait{stroke:var(--encre);stroke-width:5}
.brouillon{stroke:var(--indigo);stroke-width:5;opacity:.85}
.indice{stroke:var(--shu);stroke-width:5;opacity:0}
.verdict{min-height:38px;margin-top:12px;font-size:13px;text-align:center;color:var(--doux)}
.verdict.juste-txt{color:var(--vert)}
.verdict.faux-txt{color:var(--shu)}
.note-b.suggere{border-color:var(--indigo);border-width:2px}
.guide{position:absolute;font-size:150px;line-height:1;color:var(--encre);opacity:.10;z-index:1;pointer-events:none}

/* ---- lectures & mots ---- */
.bloc{border-top:1px solid var(--regle);padding-top:14px;margin-top:18px}
.lect{display:flex;gap:12px;align-items:baseline;margin-bottom:6px}
.lect b{font-size:17px;color:var(--indigo);flex:0 0 22px;font-weight:400}
.lect span{font-size:16px;letter-spacing:.04em}
.sens{font-size:21px;text-align:center;margin:16px 0 2px}
.mot{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--regle)}
.mot i{font-size:18px;font-style:normal}
.mot em{font-size:13px;color:var(--doux);font-style:normal}
.mot span{font-size:13px;color:var(--doux);margin-left:auto;text-align:right}

/* ---- QCM ---- */
.choix{display:grid;gap:8px;margin-top:20px}
.choix.gros{grid-template-columns:1fr 1fr}
.opt{
  border:1px solid var(--regle);background:var(--carte);color:var(--encre);
  padding:14px 12px;text-align:center;font-size:16px;transition:none;
}
.opt.k{font-size:44px;padding:14px 0;line-height:1.1}
.opt.juste{border-color:var(--vert);color:var(--vert)}
.opt.faux{border-color:var(--shu);color:var(--shu)}
.opt.choisi{border-color:var(--indigo);color:var(--indigo);border-width:2px}
.lect-bloc{margin-top:18px}
.lect-tete{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.lect-tete b{font-size:19px;color:var(--indigo);font-weight:400}
.choix.deux{grid-template-columns:1fr 1fr}
.opt:disabled{cursor:default}

/* ---- notes SRS ---- */
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.note-b{border:1px solid var(--regle);background:none;color:var(--encre);padding:12px 2px;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center}
.note-b small{font-size:10px;color:var(--doux);font-variant-numeric:tabular-nums}
.note-b.encore{border-color:var(--shu);color:var(--shu)}

/* ---- listes / sélection ---- */
.lecon{border:1px solid var(--regle);background:var(--carte);margin-bottom:8px}
.lecon-tete{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.lecon-tete b{font-weight:500;font-size:14px}
.lecon-tete .meta{margin-left:auto}
.puces{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 12px}
.puce{
  border:1px solid var(--regle);background:none;color:var(--doux);
  width:42px;height:42px;font-size:22px;display:flex;align-items:center;justify-content:center;
}
.puce.on{border-color:var(--indigo);color:var(--encre);background:var(--papier)}
.jauge{height:2px;background:var(--regle)}
.jauge div{height:100%;background:var(--indigo)}

/* ---- réglages ---- */
.opt-ligne{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--regle)}
.opt-ligne label{flex:1;font-size:14px}
.opt-ligne .meta{font-size:12px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--indigo)}
input[type=number],input[type=text]{
  background:var(--carte);border:1px solid var(--regle);color:var(--encre);
  padding:8px;font-family:inherit;font-size:15px;border-radius:2px;width:100%;
}
input[type=number]{width:70px;text-align:center}

/* ---- barre de navigation ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;background:var(--carte);border-top:1px solid var(--regle);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;color:var(--doux);
  padding:11px 4px;font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center;
}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:var(--indigo)}
.pastille{
  position:absolute;transform:translate(16px,-4px);background:var(--shu);color:#fff;
  font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;padding:0 4px;font-variant-numeric:tabular-nums;
}

.barre{display:flex;gap:3px;margin-bottom:18px}
.barre span{flex:1;height:3px;background:var(--regle)}
.barre span.on{background:var(--indigo)}
.sceau{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border:1.5px solid var(--shu);color:var(--shu);font-size:13px;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app"></div>
<nav id="nav"></nav>

/* index des kanji ------------------------------------------------ */
function construireIndex(){
  const idx = {}, groupes = [];
  LECONS.forEach((l,i)=>{
    const liste = l[2].map(k=>{
      const c = {k:k[0], sens:k[1], on:k[2], kun:k[3],
        mots:k[4].split(";").map(m=>m.split("|")), lecon:i};
      idx[c.k] = c; return c;
    });
    groupes.push({titre:l[0], sous:l[1], liste, id:i});
  });
  if(S.perso.length){
    const liste = S.perso.map(p=>{
      const c = {k:p.k, sens:p.sens, on:p.on||"—", kun:p.kun||"—",
        mots:(p.mots||"").split(";").filter(Boolean).map(m=>m.split("|")), lecon:99, perso:true};
      idx[c.k] = c; return c;
    });
    groupes.push({titre:"Mes kanji", sous:"ajoutés à la main", liste, id:99});
  }
  return {idx, groupes};
}
let {idx:IDX, groupes:GROUPES} = construireIndex();
function rafraichirIndex(){ const r = construireIndex(); IDX = r.idx; GROUPES = r.groupes; }

const actifs = () => Object.keys(S.actifs).filter(k=>S.actifs[k] && IDX[k]);
const typesActifs = () => TYPES.filter(t=>S.types[t.id]).map(t=>t.id);

/* ================================================================
   4. MOTEUR SRS
   ================================================================ */

const JOUR = 86400000;
const aujourdhui = () => new Date().toISOString().slice(0,10);

function planifier(f, note){
  let {ease=2.5, interval=0, reps=0, lapses=0} = f || {};
  if(note === 0) return {ease:Math.max(1.3,ease-0.2), interval:0, reps:0, lapses:lapses+1, due:Date.now()};
  reps++;
  if(note === 3) ease = Math.max(1.3, ease-0.15);
  if(note === 5) ease = Math.min(3.0, ease+0.1);
  if(reps === 1) interval = note===5 ? 3 : 1;
  else if(reps === 2) interval = note===3 ? 3 : 6;
  else interval = Math.round(interval * (note===3 ? 1.3 : ease) * (note===5 ? 1.3 : 1));
  interval = Math.max(1, Math.min(interval, 365));
  return {ease, interval, reps, lapses, due:Date.now() + interval*JOUR};
}
const acquis = f => f && f.interval >= 21;

/* file du jour --------------------------------------------------- */
function fileDuJour(){
  const now = Date.now(), du = [], neufs = [];
  actifs().forEach(k=>{
    typesActifs().forEach(t=>{
      const f = S.fiches[k+"|"+t];
      if(!f) neufs.push({k,t});
      else if(f.due <= now) du.push({k,t});
    });
  });
  melanger(du); melanger(neufs);
  return du.concat(neufs.slice(0, Math.max(0, S.nouveauxParJour)));
}
function melanger(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
const alea = a => a[(Math.random()*a.length)|0];

/* ================================================================
   6. SESSION D'EXERCICES
   ================================================================ */

function demarrer(){
  const file = fileDuJour();
  if(!file.length) return;
  session = {file, i:0, revele:false, vues:0, ratees:0, reponse:null, ecr:null, lect:null};
  rendre();
}

function terminer(){ session = null; vue = "accueil"; rendre(); }

function journaliser(){
  const j = aujourdhui();
  S.journal[j] = (S.journal[j]||0) + 1;
  const cles = Object.keys(S.journal).sort();
  while(cles.length > 60) delete S.journal[cles.shift()];
}

function noter(note){
  const {k,t} = session.file[session.i];
  S.fiches[k+"|"+t] = planifier(S.fiches[k+"|"+t], note);
  journaliser(); enregistrer();
  session.vues++;
  const reste = session.file.slice();
  const [c] = reste.splice(session.i, 1);
  if(note === 0){ session.ratees++; reste.push(c); }        // repasse en fin de session
  session.file = reste;
  if(!reste.length){ session = {...session, fini:true}; rendre(); return; }
  session.i = session.i >= reste.length ? 0 : session.i;
  session.revele = false; session.reponse = null; session.ecr = null; session.lect = null;
  rendre();
}

function distracteurs(bon, n, extraire, valeurBonne){
  const bassin = actifs().map(k=>IDX[k]).filter(c=>c && c.k !== bon.k);
  const secours = Object.values(IDX).filter(c=>c.k !== bon.k);
  const src = bassin.length >= n ? bassin : secours;
  const vus = new Set([valeurBonne !== undefined ? valeurBonne : extraire(bon)]), out = [];
  melanger(src.slice()).forEach(c=>{
    if(out.length >= n) return;
    const v = extraire(c);
    if(v && !vus.has(v)){ vus.add(v); out.push(c); }
  });
  return out;
}

function blocLectures(c){
  return `<div class="bloc">
    <div class="lect"><b class="jp">音</b><span class="jp">${esc(c.on)}</span></div>
    <div class="lect"><b class="jp">訓</b><span class="jp">${esc(c.kun)}</span></div>
  </div>`;
}
function blocMots(c){
  if(!c.mots.length) return "";
  return `<div class="bloc">${c.mots.map(m=>
    `<div class="mot"><i class="jp">${esc(m[0])}</i><em class="jp">${esc(m[1]||"")}</em><span>${esc(m[2]||"")}</span></div>`
  ).join("")}</div>`;
}

function vueSession(){
  if(session.fini){
    app.innerHTML = `<div class="centre" style="padding-top:40px">
      <div class="carreau" style="max-width:150px"><span class="glyphe jp" style="font-size:76px;color:var(--shu)">済</span></div>
      <div class="sens">Session terminée</div>
      <p class="meta" style="margin-bottom:26px">${session.vues} révision${session.vues>1?"s":""} · ${session.ratees} à retravailler</p>
      <button class="b1" id="fin">Retour</button></div>`;
    $("#fin").onclick = terminer;
    return;
  }

  const {k,t} = session.file[session.i];
  const c = IDX[k];
  const type = TYPES.find(x=>x.id === t);
  const tete = `<div class="rangee" style="margin-bottom:16px">
      <span class="meta">${type.nom}</span>
      <span class="meta" style="margin-left:auto">${session.file.length} restante${session.file.length>1?"s":""}</span>
    </div>`;

  if(t === "ecriture") return exoEcriture(c, tete);
  if(session.revele)   return revelation(c, tete);
  if(t === "lecture")  return exoLectures(c, tete);
  return exoQCM(c, t, tete);
}

/* ---- QCM ---- */
function exoQCM(c, t, tete){
  let question, extraire, rendreOpt, gros = false;

  if(t === "sens"){
    question = `<div class="carreau"><span class="glyphe jp">${c.k}</span></div>`;
    extraire = x => x.sens;
    rendreOpt = x => esc(x.sens);
  } else if(t === "kanji"){
    question = `<div class="sens" style="margin:30px 0">${esc(c.sens)}</div>`;
    extraire = x => x.k;
    rendreOpt = x => `<span class="jp">${x.k}</span>`;
    gros = true;
  } else { // mot
    if(!c.mots.length){ noter(4); return; }
    if(!session.motChoisi) session.motChoisi = alea(c.mots);
    const m = session.motChoisi;
    question = `<div class="centre" style="margin:26px 0">
        <div class="jp" style="font-size:56px;line-height:1.2">${esc(m[0])}</div>
        <div class="meta" style="margin-top:6px">${esc(m[2]||"")}</div></div>`;
    extraire = x => (x.mots[0] && x.mots[0][1]) || "";
    rendreOpt = x => `<span class="jp">${esc(x === c ? session.motChoisi[1] : x.mots[0][1])}</span>`;
  }

  const valeurBonne = t === "mot" ? session.motChoisi[1] : extraire(c);
  const options = melanger([c, ...distracteurs(c, 3, extraire, valeurBonne)]);

  app.innerHTML = tete + question +
    `<div class="choix ${gros?"gros":""}">${options.map((o,i)=>
      `<button class="opt ${gros?"k":""}" data-i="${i}" data-bon="${o===c?1:0}">${rendreOpt(o)}</button>`).join("")}</div>
     <div class="centre" style="margin-top:16px"><button class="b2" id="sais-pas">Je ne sais pas</button></div>
     <div class="centre" style="margin-top:10px"><button class="b2" id="stop">Interrompre</button></div>`;

  function devoiler(bon, cible){
    app.querySelectorAll(".opt").forEach(x=>{
      x.disabled = true;
      if(x.dataset.bon === "1") x.classList.add("juste");
    });
    if(cible && !bon) cible.classList.add("faux");
    $("#sais-pas").disabled = true;
    session.reponse = bon;
    setTimeout(()=>{ session.revele = true; session.motChoisi = null; rendre(); }, bon ? 450 : 1100);
  }
  app.querySelectorAll(".opt").forEach(b=>b.onclick = ()=> devoiler(b.dataset.bon === "1", b));
  $("#sais-pas").onclick = ()=> devoiler(false, null);
  $("#stop").onclick = terminer;
}

/* ---- lectures 音 et 訓 séparées : deux réponses à donner ----
   Les deux listes sont indépendantes, donc impossible de déduire
   l'une de l'autre. Le verdict n'apparaît qu'une fois les deux
   choix faits, pour que le premier n'oriente pas le second.      */
function exoLectures(c, tete){
  const aOn  = c.on  && c.on  !== "—";
  const aKun = c.kun && c.kun !== "—";
  if(!aOn && !aKun){ noter(4); return; }        // rien à demander

  const L = session.lect || (session.lect = {});
  if(!L.pret){
    L.optOn  = aOn  ? melanger([c, ...distracteurs(c, 3, x => x.on  !== "—" ? x.on  : "", c.on )]) : [];
    L.optKun = aKun ? melanger([c, ...distracteurs(c, 3, x => x.kun !== "—" ? x.kun : "", c.kun)]) : [];
    L.on = null; L.kun = null; L.pret = true;
  }

  const bloc = (cle, etiq, sous, opts, deux) => !opts.length ? "" : `
    <div class="lect-bloc">
      <div class="lect-tete"><b class="jp">${etiq}</b><span class="meta">${sous}</span></div>
      <div class="choix ${deux ? "deux" : ""}">${opts.map((o,i)=>
        `<button class="opt jp" data-cle="${cle}" data-i="${i}" data-bon="${o === c ? 1 : 0}">${esc(cle === "on" ? o.on : o.kun)}</button>`
      ).join("")}</div>
    </div>`;

  app.innerHTML = tete +
    `<div class="carreau" style="max-width:150px"><span class="glyphe jp" style="font-size:78px">${c.k}</span></div>
     <div class="meta centre" style="margin:16px 0 2px">${aOn && aKun ? "Donnez les deux lectures" : "Donnez la lecture"}</div>
     ${bloc("on",  "音", "lecture sino-japonaise", L.optOn,  true)}
     ${bloc("kun", "訓", "lecture japonaise",      L.optKun, false)}
     <div class="centre" style="margin-top:18px"><button class="b2" id="sais-pas">Je ne sais pas</button></div>
     <div class="centre" style="margin-top:10px"><button class="b2" id="stop">Interrompre</button></div>`;

  const complet = () => (!aOn || L.on !== null) && (!aKun || L.kun !== null);

  function devoiler(abandon){
    app.querySelectorAll(".opt").forEach(x=>{
      x.disabled = true; x.classList.remove("choisi");
      const choisi = +x.dataset.i === L[x.dataset.cle];
      if(x.dataset.bon === "1") x.classList.add("juste");
      else if(choisi) x.classList.add("faux");
    });
    $("#sais-pas").disabled = true;
    const juste = !abandon
      && (!aOn  || L.optOn [L.on ] === c)
      && (!aKun || L.optKun[L.kun] === c);
    session.reponse = juste;
    setTimeout(()=>{ session.lect = null; session.revele = true; rendre(); }, juste ? 550 : 1300);
  }

  app.querySelectorAll(".opt").forEach(b=>b.onclick = ()=>{
    const cle = b.dataset.cle;
    L[cle] = +b.dataset.i;
    app.querySelectorAll(`.opt[data-cle="${cle}"]`).forEach(x=>x.classList.remove("choisi"));
    b.classList.add("choisi");
    if(complet()) devoiler(false);
  });
  $("#sais-pas").onclick = ()=> devoiler(true);
  $("#stop").onclick = ()=>{ session.lect = null; terminer(); };
}

/* ---- révélation + notation ---- */
function revelation(c, tete){
  const bon = session.reponse;
  const sug = bon === true ? 4 : bon === false ? 0 : -1;
  const p = n => planifier(S.fiches[c.k+"|"+session.file[session.i].t], n).interval;
  app.innerHTML = tete +
    `<div class="carreau"><span class="glyphe jp">${c.k}</span></div>
     <div class="sens">${esc(c.sens)}</div>
     ${blocLectures(c)}${blocMots(c)}
     ${bon === false ? `<div class="note" style="border-color:var(--shu)">Réponse manquée. Choisissez « Encore » pour la revoir dans cette session.</div>` : ""}
     <div class="notes">
       <button class="note-b encore ${sug===0?"suggere":""}" data-n="0">Encore<small>maintenant</small></button>
       <button class="note-b" data-n="3">Difficile<small>${p(3)} j</small></button>
       <button class="note-b ${sug===4?"suggere":""}" data-n="4">Bien<small>${p(4)} j</small></button>
       <button class="note-b" data-n="5">Facile<small>${p(5)} j</small></button>
     </div>
     <div class="centre" style="margin-top:16px"><button class="b2" id="stop">Interrompre</button></div>`;
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick = ()=>noter(+b.dataset.n));
  $("#stop").onclick = terminer;
}

/* ---- écriture au doigt : moteur de reconnaissance de tracé ----
   Chaque trait de l'utilisateur est comparé au trait attendu de KanjiVG :
   position de départ, position d'arrivée, forme, sens et longueur.
   L'ordre est imposé — si le trait est juste mais arrive trop tôt,
   l'application le dit explicitement.                              */

const SEUILS = {
  strict: {debut:16, fin:16, moyenne: 9, cos:0.55, rmin:0.65, rmax:1.60, point:11},
  normal: {debut:22, fin:22, moyenne:12, cos:0.25, rmin:0.45, rmax:2.30, point:16},
  souple: {debut:30, fin:30, moyenne:17, cos:0.00, rmin:0.32, rmax:3.20, point:22}
};
const N_ECH = 16;   // points de rééchantillonnage par trait

const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
function longueur(p){ let s=0; for(let i=1;i<p.length;i++) s += dist(p[i-1],p[i]); return s; }

/* rééchantillonne une polyligne en n points équidistants */
function reechantillonner(p, n){
  if(p.length < 2) return Array.from({length:n}, ()=> (p[0]||[0,0]).slice());
  const cum=[0];
  for(let i=1;i<p.length;i++) cum.push(cum[i-1] + dist(p[i-1],p[i]));
  const L = cum[cum.length-1];
  if(L === 0) return Array.from({length:n}, ()=> p[0].slice());
  const out=[];
  for(let i=0;i<n;i++){
    const cible = L*i/(n-1);
    let j=1; while(j < cum.length-1 && cum[j] < cible) j++;
    const seg = cum[j]-cum[j-1] || 1;
    const t = (cible - cum[j-1]) / seg;
    out.push([p[j-1][0] + (p[j][0]-p[j-1][0])*t, p[j-1][1] + (p[j][1]-p[j-1][1])*t]);
  }
  return out;
}

function comparerTraits(u, m){
  const n = u.length;
  let somme = 0; for(let i=0;i<n;i++) somme += dist(u[i], m[i]);
  const du = [u[n-1][0]-u[0][0], u[n-1][1]-u[0][1]];
  const dm = [m[n-1][0]-m[0][0], m[n-1][1]-m[0][1]];
  const nu = Math.hypot(du[0],du[1]), nm = Math.hypot(dm[0],dm[1]);
  const lm = longueur(m);
  return {
    debut: dist(u[0], m[0]),
    fin: dist(u[n-1], m[n-1]),
    moyenne: somme/n,
    cos: (nu < 1 || nm < 1) ? 1 : (du[0]*dm[0] + du[1]*dm[1])/(nu*nm),
    ratio: lm < 1 ? 1 : longueur(u)/lm
  };
}

/* verdict sur un trait — u et m sont rééchantillonnés, repère 109×109 */
function verdictTrait(u, m, s){
  const lm = longueur(m);
  if(lm < 9){                                   // point ou trait très court
    const cu = [(u[0][0]+u[u.length-1][0])/2, (u[0][1]+u[u.length-1][1])/2];
    const cm = [(m[0][0]+m[m.length-1][0])/2, (m[0][1]+m[m.length-1][1])/2];
    return dist(cu,cm) <= s.point && longueur(u) <= lm + 24
      ? {ok:true} : {ok:false, raison:"place"};
  }
  const c = comparerTraits(u, m);
  if(c.ratio < s.rmin)                 return {ok:false, raison:"court"};
  if(c.ratio > s.rmax)                 return {ok:false, raison:"long"};
  if(c.cos < s.cos)                    return {ok:false, raison:"sens"};
  if(c.debut > s.debut || c.fin > s.fin) return {ok:false, raison:"depart"};
  if(c.moyenne > s.moyenne)            return {ok:false, raison:"forme"};
  return {ok:true};
}

const RAISONS = {
  sens:   "Trait tracé dans le mauvais sens. En japonais, on va toujours de haut en bas et de gauche à droite.",
  depart: "Le trait ne part pas du bon endroit.",
  court:  "Trait trop court.",
  long:   "Trait trop long.",
  forme:  "La forme ne correspond pas au trait attendu.",
  place:  "Ce point n'est pas au bon endroit."
};

/* ---- exercice ---- */
function exoEcriture(c, tete){
  if(session.revele) return revelation(c, tete);

  const modele = (typeof TRACES !== "undefined") && TRACES[c.k];
  if(!modele) return exoEcritureLibre(c, tete);      // kanji perso : auto-évaluation

  const E = session.ecr || (session.ecr = {n:0, erreurs:0, echecs:0, aide:0});
  const s = SEUILS[S.tolerance] || SEUILS.normal;

  app.innerHTML = tete +
    `<div class="sens">${esc(c.sens)}</div>
     <div class="bloc" style="padding-bottom:4px">
       <div class="lect"><b class="jp">音</b><span class="jp">${esc(c.on)}</span></div>
       <div class="lect"><b class="jp">訓</b><span class="jp">${esc(c.kun)}</span></div>
     </div>
     <div class="meta centre" id="compteur" style="margin:14px 0 10px"></div>
     <div class="carreau">
       ${S.guide ? `<span class="guide jp">${c.k}</span>` : ""}
       <svg id="tableau" viewBox="0 0 109 109">
         <g id="faits"></g>
         <path id="indice" class="indice"></path>
         <polyline id="brouillon" class="brouillon"></polyline>
       </svg>
     </div>
     <div id="verdict" class="verdict"></div>
     <div class="rangee" style="justify-content:center;margin-top:12px" id="outils">
       <button class="b2" id="aide">Montrer le trait</button>
       <button class="b2" id="reprendre">Recommencer</button>
     </div>
     <div class="centre" style="margin-top:8px" id="outils2">
       <button class="b2" id="sais-pas">Je ne sais pas — montrer le kanji</button>
     </div>
     <div id="apres"></div>
     <div class="centre" style="margin-top:14px"><button class="b2" id="stop">Interrompre</button></div>`;

  const svg = $("#tableau"), gFaits = $("#faits"), indice = $("#indice"), brouillon = $("#brouillon");
  const boite = $("#verdict"), compteur = $("#compteur");

  /* points de référence de chaque trait, calculés par le navigateur */
  const sonde = document.createElementNS("http://www.w3.org/2000/svg","path");
  svg.appendChild(sonde);
  const pointsModele = modele.map(d=>{
    sonde.setAttribute("d", d);
    const L = sonde.getTotalLength();
    const brut = [];
    for(let i=0;i<=40;i++){ const p = sonde.getPointAtLength(L*i/40); brut.push([p.x,p.y]); }
    return reechantillonner(brut, N_ECH);
  });
  svg.removeChild(sonde);

  function majCompteur(){
    compteur.textContent = E.n >= modele.length
      ? `${modele.length} traits — terminé`
      : `Trait ${E.n+1} sur ${modele.length}${E.erreurs ? ` · ${E.erreurs} erreur${E.erreurs>1?"s":""}` : ""}`;
  }
  function dessinerFaits(){
    gFaits.innerHTML = modele.slice(0, E.n).map(d=>`<path class="fait" d="${d}"></path>`).join("");
  }
  function animerIndice(d){
    indice.setAttribute("d", d);
    indice.style.opacity = 1;
    const L = indice.getTotalLength();
    indice.style.transition = "none";
    indice.style.strokeDasharray = L;
    indice.style.strokeDashoffset = L;
    indice.getBoundingClientRect();
    const calme = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    indice.style.transition = `stroke-dashoffset ${calme ? 0 : 0.85}s ease-in-out`;
    indice.style.strokeDashoffset = 0;
  }
  function cacherIndice(){ indice.style.opacity = 0; indice.removeAttribute("d"); }
  function message(txt, type){
    boite.textContent = txt || "";
    boite.className = "verdict" + (type ? " " + type : "");
  }

  dessinerFaits(); majCompteur();

  /* ---- saisie ---- */
  let trace = false, pts = [];
  const coord = e=>{
    const r = svg.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return [(t.clientX - r.left) / r.width * 109, (t.clientY - r.top) / r.height * 109];
  };
  const peindre = ()=> brouillon.setAttribute("points", pts.map(p=>p.join(",")).join(" "));

  /* évènements « pointer » uniquement : ils couvrent doigt, stylet et souris.
     touch-action:none (CSS) empêche le défilement pendant le tracé.
     La capture évite de perdre le trait si le doigt sort du carreau. */
  function debut(e){
    if(E.n >= modele.length) return;
    e.preventDefault();
    try{ svg.setPointerCapture(e.pointerId); }catch{}
    trace = true; pts = [coord(e)]; peindre();
  }
  function bouge(e){ if(!trace) return; e.preventDefault(); pts.push(coord(e)); peindre(); }
  function fin(e){
    if(!trace) return;
    trace = false; e.preventDefault();
    const brut = pts;
    pts = []; brouillon.removeAttribute("points");
    if(!brut.length) return;
    evaluer(brut);
  }
  svg.addEventListener("pointerdown", debut);
  svg.addEventListener("pointermove", bouge);
  svg.addEventListener("pointerup", fin);
  svg.addEventListener("pointercancel", fin);

  /* ---- évaluation d'un trait ---- */
  function evaluer(brut){
    const u = reechantillonner(brut, N_ECH);
    const attendu = pointsModele[E.n];
    const v = verdictTrait(u, attendu, s);

    if(v.ok){
      E.n++; E.echecs = 0; cacherIndice(); dessinerFaits(); majCompteur();
      message(E.n >= modele.length ? "" : "Trait correct.", E.n >= modele.length ? "" : "juste-txt");
      if(E.n >= modele.length) terminerCaractere(false);
      return;
    }

    E.erreurs++; E.echecs++;

    /* le trait est-il correct, mais joué trop tôt ? */
    let ordre = -1;
    for(let j = E.n + 1; j < modele.length; j++){
      if(verdictTrait(u, pointsModele[j], s).ok){ ordre = j; break; }
    }
    if(ordre >= 0){
      message(`Ce trait est bien tracé, mais c'est le n° ${ordre+1}. Le trait n° ${E.n+1} vient d'abord.`, "faux-txt");
    } else if(verdictTrait(u, attendu.slice().reverse(), s).ok){
      message(RAISONS.sens, "faux-txt");
    } else {
      message(RAISONS[v.raison] || RAISONS.forme, "faux-txt");
    }

    majCompteur();
    if(E.echecs >= 2) animerIndice(modele[E.n]);   // au 2e échec, on montre
  }

  /* démonstration : les traits restants se dessinent dans l'ordre,
     à une vitesse proportionnelle à leur longueur */
  function animerTrait(i){
    return new Promise(res=>{
      const p = document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("class","fait"); p.setAttribute("d", modele[i]);
      gFaits.appendChild(p);
      const L = p.getTotalLength();
      const calme = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duree = calme ? 0 : Math.max(0.25, Math.min(0.9, L/55));
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset ${duree}s linear`;
      p.style.strokeDashoffset = 0;
      setTimeout(res, duree*1000 + 130);
    });
  }
  async function demontrer(){
    if(E.demo) return;
    E.demo = true;
    cacherIndice();
    $("#aide").disabled = $("#reprendre").disabled = $("#sais-pas").disabled = true;
    message(`Ordre des traits — regardez.`, "");
    for(let i = E.n; i < modele.length; i++){
      if(!document.contains(svg)) return;    // l'utilisateur a quitté l'écran
      await animerTrait(i);
    }
    if(!document.contains(svg)) return;
    E.n = modele.length; majCompteur();
    terminerCaractere(true);
  }

  function terminerCaractere(abandon){
    cacherIndice();
    const note = abandon ? 0 : E.erreurs === 0 ? 4 : E.erreurs <= 2 ? 3 : 0;
    const p = n => planifier(S.fiches[c.k+"|ecriture"], n).interval;
    message(abandon
      ? `${modele.length} traits. La carte revient dans cette session.`
      : E.erreurs === 0
        ? `Caractère complet, ${modele.length} traits sans erreur.`
        : `Caractère complet — ${E.erreurs} erreur${E.erreurs>1?"s":""}.`,
      abandon ? "" : E.erreurs === 0 ? "juste-txt" : "");
    $("#outils").style.display = $("#outils2").style.display = "none";
    $("#apres").innerHTML = `<div class="notes">
        <button class="note-b encore ${note===0?"suggere":""}" data-n="0">Encore<small>maintenant</small></button>
        <button class="note-b ${note===3?"suggere":""}" data-n="3">Difficile<small>${p(3)} j</small></button>
        <button class="note-b ${note===4?"suggere":""}" data-n="4">Bien<small>${p(4)} j</small></button>
        <button class="note-b" data-n="5">Facile<small>${p(5)} j</small></button>
      </div>`;
    $("#apres").querySelectorAll("[data-n]").forEach(b=>b.onclick = ()=>{
      session.ecr = null; noter(+b.dataset.n);
    });
  }

  $("#aide").onclick = ()=>{
    if(E.n >= modele.length) return;
    E.erreurs++; E.echecs = 0; E.aide++;
    animerIndice(modele[E.n]); majCompteur();
    message(`Trait n° ${E.n+1} — reproduisez-le.`, "");
  };
  $("#reprendre").onclick = ()=>{
    session.ecr = {n:0, erreurs:E.erreurs, echecs:0, aide:E.aide};
    rendre();
  };
  $("#sais-pas").onclick = demontrer;
  $("#stop").onclick = ()=>{ session.ecr = null; terminer(); };
}

/* repli pour un kanji sans données de tracé (ajouté à la main) */
function exoEcritureLibre(c, tete){
  app.innerHTML = tete +
    `<div class="sens">${esc(c.sens)}</div>${blocLectures(c)}
     <div class="note">Pas de données de tracé pour ce kanji ajouté à la main : l'ordre des traits ne peut pas être vérifié. Tracez, puis comparez vous-même.</div>
     <div class="carreau">
       <svg id="tableau" viewBox="0 0 109 109"><polyline id="brouillon" class="brouillon"></polyline>
       <g id="faits"></g></svg>
     </div>
     <div class="rangee" style="justify-content:center;margin-top:12px">
       <button class="b2" id="effacer">Effacer</button>
     </div>
     <div style="margin-top:18px"><button class="b1" id="verif">Vérifier</button></div>
     <div class="centre" style="margin-top:10px"><button class="b2" id="sais-pas">Je ne sais pas</button></div>
     <div class="centre" style="margin-top:10px"><button class="b2" id="stop">Interrompre</button></div>`;

  const svg = $("#tableau"), br = $("#brouillon"), gf = $("#faits");
  let trace = false, pts = [], faits = [];
  const coord = e=>{ const r = svg.getBoundingClientRect(); const t = e.touches?e.touches[0]:e;
    return [(t.clientX-r.left)/r.width*109, (t.clientY-r.top)/r.height*109]; };
  const peindre = ()=> br.setAttribute("points", pts.map(p=>p.join(",")).join(" "));
  const redessiner = ()=> gf.innerHTML = faits.map(f=>`<polyline class="brouillon" points="${f.map(p=>p.join(",")).join(" ")}"></polyline>`).join("");

  svg.addEventListener("pointerdown", e=>{ e.preventDefault(); try{svg.setPointerCapture(e.pointerId);}catch{} trace=true; pts=[coord(e)]; peindre(); });
  svg.addEventListener("pointermove", e=>{ if(!trace) return; e.preventDefault(); pts.push(coord(e)); peindre(); });
  const relacher = ()=>{ if(!trace) return; trace=false; if(pts.length>1) faits.push(pts); pts=[]; br.removeAttribute("points"); redessiner(); };
  svg.addEventListener("pointerup", relacher);
  svg.addEventListener("pointercancel", relacher);

  $("#effacer").onclick = ()=>{ faits=[]; pts=[]; br.removeAttribute("points"); redessiner(); };
  $("#verif").onclick = ()=>{ session.reponse = null; session.revele = true; rendre(); };
  $("#sais-pas").onclick = ()=>{ session.reponse = false; session.revele = true; rendre(); };
  $("#stop").onclick = terminer;
}

barreNav.addEventListener("click", e=>{
  const b = e.target.closest("[data-vue]");
  if(!b) return;
  vue = b.dataset.vue; session = null; rendre();
});

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

rendre();
